name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per `make check` target, so CI runs exactly what a developer runs
# locally and there is one list to maintain. The whole toolchain (Go, Node,
# golangci-lint, sqlc) comes from mise.toml.
jobs:
  check:
    name: make ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fmt-check, vet, lint, generate-check, test, test-tz, test-race, web-check]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('web/admin/package-lock.json') }}
      - run: make ${{ matrix.target }}
