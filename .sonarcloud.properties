# SonarCloud AUTOMATIC ANALYSIS reads this file -- not
# sonar-project.properties, which only CI-based scanners read. This project
# has no CI-side scanner, so this file is the one that actually applies;
# keep the exclusion list in both files in sync.
#
# internal/store/sqlite/gen is sqlc output: `make generate` overwrites it
# wholesale and `make check` fails if it drifts, so any duplication or smell
# reported there describes sqlc's generator, not this codebase. The admin
# SPA build outputs are vite output committed only for go:embed.
sonar.exclusions=internal/store/sqlite/gen/**,internal/httpapi/adminui/dist/**,web/admin/build/**,web/admin/node_modules/**
