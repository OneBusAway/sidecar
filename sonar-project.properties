# SonarCloud analysis settings for CI-based scanners. NOTE: this repo uses
# SonarCloud Automatic Analysis, which reads .sonarcloud.properties instead
# of this file -- keep the exclusion lists in the two files in sync. This
# file stays so a future CI-side scanner inherits the same scope.

# internal/store/sqlite/gen is sqlc output. `make generate` overwrites it
# wholesale from the .sql sources and `make generate-check` fails the build if
# it drifts, so any duplication or smell reported there describes sqlc's code
# generator, not this codebase -- and could only be "fixed" by hand-editing a
# file that is regenerated. The same goes for the built admin SPA and its
# embedded copy, which are vite output committed only so the Go binary can
# embed them.
sonar.exclusions=internal/store/sqlite/gen/**,internal/httpapi/adminui/dist/**,web/admin/build/**,web/admin/node_modules/**

# Nothing else is excluded. Test duplication in particular is left visible:
# the tables in this branch's tests were genuinely copy-pasted per case and
# were collapsed rather than silenced.
